{% load crispy_forms_tags %}
<div id="accesos-contenedor">
    <table class="table table-hover align-middle mb-4">
        <thead>
            <tr>
                <th>Clínica</th>
                <th>Rol</th>
                <th class="text-end">Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for asignacion in asignaciones %}
                <tr>
                    <td>{{ asignacion.clinica|default:'Grupo (todas las clínicas)' }}</td>
                    <td>{{ asignacion.get_rol_display }}</td>
                    <td class="text-end">
                        <button type="button" class="btn btn-sm btn-outline-danger" title="Quitar acceso"
                                hx-post="{% url 'usuarios:usuario-acceso-eliminar' usuario.pk asignacion.pk %}"
                                hx-target="#accesos-contenedor" hx-swap="outerHTML"
                                hx-confirm="¿Quitar este acceso?">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
            {% empty %}
                <tr>
                    <td colspan="3" class="text-secondary">Este usuario no tiene accesos asignados.</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>

    <div class="card">
        <div class="card-body">
            <h6 class="card-title">Añadir acceso</h6>
            <form hx-post="{% url 'usuarios:usuario-acceso-crear' usuario.pk %}"
                  hx-target="#accesos-contenedor" hx-swap="outerHTML">
                {% crispy form %}
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-plus-lg"></i> Asignar
                </button>
            </form>
        </div>
    </div>
</div>
