services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # sin publicar el puerto al host: el contenedor django lo alcanza por la red interna de
    # compose (db:5432) y así no choca con un postgres que ya pudiera estar corriendo en el
    # host en el 5432. para inspeccionarlo desde fuera: `docker compose exec db psql -U ...`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  django:
    build: .
    env_file: .env
    environment:
      # el contenedor siempre corre en producción contra el postgres de arriba, sin
      # depender de lo que tenga el .env local de cada desarrollador (que sigue sirviendo
      # para SECRET_KEY/credenciales) — POSTGRES_HOST coincide con el nombre del servicio.
      DJANGO_SETTINGS_MODULE: config.settings.production
      POSTGRES_HOST: db
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
