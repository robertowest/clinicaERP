{% load static %}<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Iniciar sesión · ERP Clínica</title>
        <link rel="stylesheet" href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}">
        <link rel="stylesheet" href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}">
        <link rel="stylesheet" href="{% static 'css/app.css' %}">
    </head>
    <body class="d-flex align-items-center justify-content-center vh-100 bg-light">
        <div class="card shadow-sm" style="width: 100%; max-width: 360px;">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-hospital fs-1 text-primary"></i>
                    <h1 class="h5 mt-2 mb-0">ERP Clínica</h1>
                </div>

                {% if form.non_field_errors %}
                    <div class="alert alert-danger py-2">{{ form.non_field_errors|join:' ' }}</div>
                {% endif %}

                <form method="post" novalidate>
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label" for="{{ form.username.id_for_label }}">Usuario</label>
                        <input type="text" name="{{ form.username.html_name }}" class="form-control"
                               id="{{ form.username.id_for_label }}" autofocus required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="{{ form.password.id_for_label }}">Contraseña</label>
                        <input type="password" name="{{ form.password.html_name }}" class="form-control"
                               id="{{ form.password.id_for_label }}" required>
                    </div>
                    <input type="hidden" name="next" value="{{ next }}">
                    <button type="submit" class="btn btn-primary w-100">Entrar</button>
                </form>
            </div>
        </div>
    </body>
</html>
