{% load crispy_forms_tags %}
<div id="clinicas-contenedor">
    <table class="table table-hover align-middle mb-4">
        <thead>
            <tr>
                <th>Clínica</th>
                <th>Especialidad</th>
                <th class="text-end">Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for asignacion in asignaciones %}
                <tr>
                    <td>{{ asignacion.clinica }}</td>
                    <td>{{ asignacion.especialidad }}</td>
                    <td class="text-end">
                        <button type="button" class="btn btn-sm btn-outline-danger" title="Quitar especialidad"
                                hx-post="{% url 'medicos:medico-clinica-eliminar' medico.pk asignacion.pk %}"
                                hx-target="#clinicas-contenedor" hx-swap="outerHTML"
                                hx-confirm="¿Quitar esta especialidad?">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
            {% empty %}
                <tr>
                    <td colspan="3" class="text-secondary">Este médico no tiene especialidades asignadas.</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>

    <div class="card">
        <div class="card-body">
            <h6 class="card-title">Añadir especialidad</h6>
            <form hx-post="{% url 'medicos:medico-clinica-crear' medico.pk %}"
                  hx-target="#clinicas-contenedor" hx-swap="outerHTML">
                {% crispy form %}
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-plus-lg"></i> Asignar
                </button>
            </form>
        </div>
    </div>
</div>
